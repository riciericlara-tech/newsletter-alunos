name: Disparar newsletter

# O envio agora roda no Mac da Clara (IP residencial = entrega confiável).
# O agendamento automático da nuvem foi DESLIGADO de propósito, para não
# brigar com o app local pela mesma sessão do WhatsApp.
# Mantemos só o disparo manual, como recurso de emergência (entrega da nuvem
# é limitada pelo WhatsApp, então use só se o Mac estiver indisponível).
on:
  workflow_dispatch: {}

# Garante que nunca rode duas vezes ao mesmo tempo (evita disparo duplicado).
concurrency:
  group: enviar-newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: node runner.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
